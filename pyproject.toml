[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "areno"
version = "0.0.7"
description = "An easy-to-use, fast toolkit to scale up RL post-training on a single node."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Zibo He" },
  { name = "Le Su" },
]
keywords = [
  "llm",
  "reinforcement-learning",
  "rlvr",
  "agentic-rl",
  "post-training",
  "fine-tuning",
  "pytorch",
  "cuda",
  "self-hosted",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6; platform_system == 'Linux'",
  "flash-linear-attention==0.5.2; platform_system == 'Linux'",
  "mlx>=0.32.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.31.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-vlm>=0.6.14; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "safetensors>=0.4",
  "transformers>=5.15,<6",
  "huggingface-hub>=0.25",
  "modelscope>=1.20",
  "addict>=2.4",
  "datasets==4.0.0",
  "math-verify",
  "numpy",
  "openai",
  "prompt-toolkit>=3.0",
  "rich>=13",
  "tensorboard",
  "tensorboardX>=2.6; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "pydantic>=2",
  "fastapi>=0.110",
  "click>=8.1",
  "tqdm>=4.66",
  "uvicorn>=0.27",
  "av>=12; platform_system == 'Linux'",
  "librosa>=0.11; platform_system == 'Linux'",
  "soundfile>=0.13; platform_system == 'Linux'",
  "torchvision>=0.21; platform_system == 'Linux'",
]

[project.optional-dependencies]
flash = [
  "flash-attn>=2.7",
]

[project.urls]
Homepage = "https://github.com/inclusionAI/AReno"
Repository = "https://github.com/inclusionAI/AReno"
Issues = "https://github.com/inclusionAI/AReno/issues"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"areno/accel/kernels/*.py" = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["areno"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["areno"]
exclude = ["areno/accel/csrc"]

[tool.setuptools.packages.find]
where = ["."]
include = ["areno*"]

[tool.setuptools.package-data]
"areno.dashboard" = ["dist/*", "dist/assets/*"]

[project.scripts]
areno = "areno.cli.main:main"
